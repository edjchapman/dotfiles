---
# Pre-commit hooks for this repo.
# Install once with: pre-commit install
# Run all hooks against the full tree: pre-commit run --all-files

default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-merge-conflict
          - id: check-yaml
            # GitHub Actions has truthy `on:` keys; mkdocs.yml uses `!!python/name:`
            # tags for the emoji generator and Mermaid superfences formatter.
            exclude: ^(\.github/workflows/|mkdocs\.yml$)
          - id: check-toml
          - id: check-added-large-files
            args: [--maxkb=500]
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: '\.age$'
          - id: mixed-line-ending
            args: [--fix=lf]

    - repo: https://github.com/scop/pre-commit-shfmt
      rev: v3.13.1-1
      hooks:
          - id: shfmt
            args: [-i=4, -ci, -bn, -d]
            # shfmt does not understand chezmoi template syntax ({{ ... }})
            # so .sh.tmpl files are linted by `make lint` (which strips templates first)
            # and explicitly NOT formatted here.
            exclude: '\.tmpl$'

    - repo: https://github.com/adrienverge/yamllint
      rev: v1.38.0
      hooks:
          - id: yamllint
            args: [-c=.yamllint.yaml]

    # markdownlint-cli2 runs against the brew-installed binary (declared in Brewfile.tmpl)
    # rather than pre-commit's bundled node env, which can carry a stale node version
    # that breaks newer markdownlint releases (Cannot find module 'node:path').

    - repo: https://github.com/gitleaks/gitleaks
      rev: v8.30.0
      hooks:
          - id: gitleaks

    - repo: https://github.com/codespell-project/codespell
      rev: v2.4.3
      hooks:
          - id: codespell
            additional_dependencies: [tomli]
            files: '\.(md|yml|yaml|toml|py|sh)$'
            exclude: '^(site/|assets/demo/|.*\.lock$)'

    - repo: local
      hooks:
          # ShellCheck for both .sh and .sh.tmpl (template-aware via Makefile).
          - id: shellcheck-via-make
            name: shellcheck (via make lint)
            entry: make lint
            language: system
            pass_filenames: false
            files: '\.(sh|sh\.tmpl)$|^executable_'

          # Blocks bash-4-only constructs in bootstrap-window scripts — see
          # docs/gotchas.md's "env bash is bash 3.2 during the bootstrap
          # window" for why this hook exists and what it replaces.
          # `files:` here is only a *trigger* — with pass_filenames: false the
          # script always sweeps its own scope, which it defines itself and is
          # the single source of truth for. Keep this pattern loose enough to
          # fire whenever an in-scope file changes; it does not need to mirror
          # the script's find(1) expression exactly. The guard and its strip
          # helper are in the trigger too, so editing either re-runs the sweep.
          - id: check-bash4-isms
            name: no bash-4-only constructs in bootstrap-window scripts
            entry: scripts/check-bash4-isms.sh
            language: system
            pass_filenames: false
            files: '(^|/)executable_[^/]*$|^(run_once_|run_onchange_)[^/]*$|^scripts/(check-bash4-isms|strip-template-actions)\.sh$'

          # Quick single-render template validation (full matrix runs in CI).
          - id: chezmoi-execute-template
            name: chezmoi execute-template (single render)
            entry: make verify-templates-quick
            language: system
            pass_filenames: false
            files: '\.tmpl$'

          - id: markdownlint-cli2
            name: markdownlint-cli2 (system)
            entry: markdownlint-cli2
            language: system
            files: '\.md$'

          # Docs-site quality gates. Fast (<2s combined); full render runs in CI.
          - id: mkdocs-config-validate
            name: mkdocs config validates
            entry: scripts/check-mkdocs-config.py
            language: system
            pass_filenames: false
            files: '^(mkdocs\.yml|docs/requirements\.txt)$'

          - id: check-mermaid-fences
            name: mermaid fence declarations are valid
            entry: scripts/check-mermaid-fences.sh
            language: system
            files: '^docs/.*\.md$'

          # Note: language: python so pre-commit creates its own venv with pyyaml,
          # which avoids depending on the system Python having pyyaml installed.
          - id: check-docs-nav
            name: every docs page is in mkdocs.yml nav
            entry: python3 scripts/check-docs-nav.py
            language: python
            additional_dependencies: [pyyaml]
            pass_filenames: false
            files: '^(mkdocs\.yml|docs/.*\.md)$'

          - id: check-requirements-sorted
            name: docs/requirements.txt alphabetised
            entry: scripts/check-requirements-sorted.sh
            language: system
            pass_filenames: false
            files: '^docs/requirements\.txt$'

          - id: check-root-mirrors
            name: docs mirrors of root files point at correct source
            entry: scripts/check-root-mirrors.sh
            language: system
            pass_filenames: false
            files: '^(CHANGELOG\.md|CONTRIBUTING\.md|SECURITY\.md|CODE_OF_CONDUCT\.md|docs/(changelog|contributing|security|code-of-conduct)\.md)$'

          # Secret scanning is not a pre-commit-stage hook: ggshield billed the
          # shared GitGuardian quota on every commit/amend/rejected attempt.
          # It moved to the global pre-push git hook (~/.config/git/hooks/pre-push,
          # managed by the dotfiles repo), which scans once per push over the
          # pushed range. Per-commit coverage stays via the gitleaks hook above
          # (free, local); GitGuardian's GitHub App is the server-side backstop.
