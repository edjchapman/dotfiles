# Two GnuPG installations share this homedir: GPG Suite's MacGPG2 2.2 (which backs the
# Finder "Services > Decrypt Selection" menu) and Homebrew's gnupg 2.5, which is not
# installed on request — it arrives as a transitive dependency of gpgme/gpgmepp/poppler
# and takes $PATH precedence via `brew shellenv`. Whichever gpg-agent starts first owns
# ~/.gnupg/S.gpg-agent and then serves both frontends. Homebrew ships only
# pinentry-curses, so when its agent wins the socket, GUI decryption is handed a
# terminal prompt it has no terminal to draw in and fails as GPG_ERR_DECRYPT_FAILED (152).
# Pinning the GUI pinentry here makes the outcome independent of which agent won.
pinentry-program /usr/local/MacGPG2/libexec/pinentry-mac.app/Contents/MacOS/pinentry-mac

default-cache-ttl 600
max-cache-ttl 7200
