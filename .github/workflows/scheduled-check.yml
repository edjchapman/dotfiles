---
# Weekly `make ci` cron — catches drift introduced via the GitHub web UI,
# ecosystem upgrades that break a previously-passing workflow, or any other
# out-of-band change. Distinct from `audit.yml` which runs full-history
# secret scans monthly.

name: scheduled-check

on:
    schedule:
        # Mondays 10:00 UTC — runs after the Monday-morning update-* workflows
        # (update-externals 09:15, update-vscode 09:30, update-mas 09:45)
        - cron: '0 10 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: scheduled-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    make-ci:
        name: make ci (scheduled)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Install chezmoi
              run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
            - name: Install linters
              # These are exactly the tools `make ci` invokes: shellcheck (lint),
              # shfmt (fmt-check), bats (test-bats), gitleaks (audit). chezmoi is
              # installed above; brew is optional and skips gracefully.
              run: |
                  sudo apt-get update && sudo apt-get install -y shellcheck bats
                  curl -sS https://webi.sh/shfmt | sh
                  # Derive the gitleaks version from .pre-commit-config.yaml so this job and
                  # the pre-commit hook never skew — update-precommit.yml bumps that one source.
                  gl_ver=$(grep -A2 'gitleaks/gitleaks' .pre-commit-config.yaml | sed -nE 's/.*rev:[[:space:]]*v?([0-9.]+).*/\1/p' | head -n1)
                  : "${gl_ver:?gitleaks rev not found in .pre-commit-config.yaml}"
                  curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${gl_ver}/gitleaks_${gl_ver}_linux_x64.tar.gz" \
                    | sudo tar -xz -C /usr/local/bin gitleaks
            - name: Run make ci
              run: make ci
